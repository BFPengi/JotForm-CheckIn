<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>In / Out Time Stamp</title>
<script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 4px; background: transparent; }
  .row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; min-height: 52px; }
  button { border: none; border-radius: 6px; color: #fff; cursor: pointer; font-weight: bold; }
  button:hover { opacity: 0.9; }
  .sq { width: 52px; height: 52px; font-size: 13px; flex-shrink: 0; padding: 2px; line-height: 1.1; word-break: break-word; }
  #inBtn  { background: #2e7d32; }
  #outBtn { background: #c62828; }
  .time { font-size: 14px; color: #333; }
  .info { display: flex; flex-direction: column; gap: 2px; }
  .note { font-size: 13px; color: #8a6d00; font-style: italic; }
  .note:empty { display: none; }
  .check { color: #1b7a3a; font-style: normal; font-weight: bold; margin-right: 4px; }
  .menu { display: none; flex-wrap: wrap; gap: 6px; flex: 1; }
  .menu.show { display: flex; }
  .menu button { padding: 8px 12px; font-size: 13px; white-space: nowrap; }
  /* Reminder choices and the reminder alert always sit on their own line under the button */
  #pickMenu, #remindMenu { flex: 0 0 100%; }
  .update { background: #1565c0; }
  .clear  { background: #757575; }
  .edit   { background: #ef6c00; }
  .addrem { background: #6a1b9a; }
  .save   { background: #2e7d32; }
  .cancel { background: #9e9e9e; }
  .menu input[type=datetime-local] { font-size: 14px; padding: 6px; border: 1px solid #bbb; border-radius: 6px; }
  .choice { background: #6a1b9a; }
  .none   { background: #9e9e9e; }
  .remind { background: #f9a825; color: #222; text-align: left; white-space: normal !important; }
  .prompt { font-size: 12px; color: #555; width: 100%; }
</style>
</head>
<body>

<div class="row">
  <button id="inBtn" class="sq" type="button">IN</button>
  <span id="inTime" class="time"></span>
  <span id="inMenu" class="menu">
    <button type="button" class="update" data-key="in">Update</button>
    <button type="button" class="edit" data-key="in">Edit</button>
    <button type="button" id="addRemBtn" class="addrem">Reminder</button>
    <button type="button" class="clear" data-key="in">Clear</button>
  </span>
  <span id="inEdit" class="menu">
    <input type="datetime-local" id="inInput">
    <button type="button" class="save" data-key="in">Save</button>
    <button type="button" class="cancel" data-key="in">Cancel</button>
  </span>
  <span id="pickMenu" class="menu"></span>
</div>

<div class="row">
  <button id="outBtn" class="sq" type="button">OUT</button>
  <span id="outInfo" class="info">
    <span id="outTime" class="time"></span>
    <span id="outNote" class="note"></span>
  </span>
  <span id="outMenu" class="menu">
    <button type="button" class="update" data-key="out">Update</button>
    <button type="button" class="edit" data-key="out">Edit</button>
    <button type="button" class="clear" data-key="out">Clear</button>
  </span>
  <span id="outEdit" class="menu">
    <input type="datetime-local" id="outInput">
    <button type="button" class="save" data-key="out">Save</button>
    <button type="button" class="cancel" data-key="out">Cancel</button>
  </span>
  <span id="remindMenu" class="menu"></span>
</div>

<script>
  /* ---------- Settings (filled in from Jotform widget settings) ---------- */
  var cfg = {
    inLabel:  "IN",
    outLabel: "OUT",
    format:   "h:mm a MMM d, yyyy",
    reminders: []          // empty = reminder feature off
  };

  var times = { in: "", out: "" };
  var reminder = "";        // chosen reminder ("" = none)

  function el(id) { return document.getElementById(id); }

  function setting(name) {
    try {
      var v = JFCustomWidget.getWidgetSetting(name);
      return (v === undefined || v === null) ? "" : String(v).trim();
    } catch (e) { return ""; }
  }

  function loadSettings() {
    cfg.inLabel  = setting("inLabel")  || cfg.inLabel;
    cfg.outLabel = setting("outLabel") || cfg.outLabel;
    cfg.format   = setting("dateFormat") || cfg.format;
    cfg.reminders = setting("reminders")
      .split(/[\n,]/)
      .map(function (s) { return s.trim(); })
      .filter(function (s) { return s && s.toLowerCase() !== "none"; });
    el("addRemBtn").style.display = cfg.reminders.length ? "" : "none";
    el("inBtn").textContent  = cfg.inLabel;
    el("outBtn").textContent = cfg.outLabel;
  }

  /* ---------- Date/time formatting ----------
     Tokens: yyyy yy | MMMM MMM MM M | dd d | EEEE EEE | HH H hh h | mm | ss | a (am/pm) A (AM/PM)
     Put plain words in [brackets] so they aren't treated as codes, e.g. "MMM d [at] h:mm a" */
  function formatDate(d, fmt) {
    var months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    var days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    var H = d.getHours(), h = H % 12 || 12;
    function p(n) { return ("0" + n).slice(-2); }
    var map = {
      yyyy: d.getFullYear(), yy: String(d.getFullYear()).slice(-2),
      MMMM: months[d.getMonth()], MMM: months[d.getMonth()].slice(0, 3),
      MM: p(d.getMonth() + 1), M: d.getMonth() + 1,
      dd: p(d.getDate()), d: d.getDate(),
      EEEE: days[d.getDay()], EEE: days[d.getDay()].slice(0, 3),
      HH: p(H), H: H, hh: p(h), h: h,
      mm: p(d.getMinutes()), ss: p(d.getSeconds()),
      a: H >= 12 ? "pm" : "am", A: H >= 12 ? "PM" : "AM"
    };
    return fmt.replace(/\[([^\]]*)\]|yyyy|yy|MMMM|MMM|MM|M|EEEE|EEE|dd|d|HH|H|hh|h|mm|ss|a|A/g,
      function (tok, literal) { return literal !== undefined ? literal : map[tok]; });
  }

  function now() { return formatDate(new Date(), cfg.format); }

  /* ---------- What gets saved (what Tables shows) ---------- */
  function resultText() {
    var lines = [];
    if (times.out) lines.push(cfg.outLabel + ": " + times.out);
    // Completed reminder goes last (third line) and stays with this submission,
    // even if the form's reminder options change later
    if (times.in)  lines.push(cfg.inLabel + ": " + times.in);
    if (reminder && times.out) lines.push("✓ " + reminder);
    // Pending reminder is saved so it survives reopening
    if (reminder && times.in && !times.out) lines.push("Reminder: " + reminder);
    return lines.join("\n");   // real line breaks (Tables grid flattens them; full views show separate lines)
  }

  /* ---------- Display ---------- */
  function hideAllMenus() {
    ["inMenu", "outMenu", "pickMenu", "remindMenu", "inEdit", "outEdit"].forEach(function (id) { el(id).classList.remove("show"); });
    el("inTime").style.display = "";
    el("outInfo").style.display = "";
  }

  function render() {
    el("inTime").textContent  = times.in;
    el("outTime").textContent = times.out;
    // OUT row note: pending reminder before check-out, checked-off reminder after
    var note = el("outNote");
    note.textContent = "";
    if (reminder && times.in && !times.out) {
      note.textContent = reminder;
    } else if (reminder && times.out) {
      var c = document.createElement("span");
      c.className = "check";
      c.textContent = "✓";
      note.appendChild(c);
      note.appendChild(document.createTextNode(reminder));
    }
    resize();
  }

  function resize() {
    if (window.JFCustomWidget) {
      JFCustomWidget.requestFrameResize({ height: document.body.scrollHeight + 8 });
    }
  }

  function save() {
    render();
    if (window.JFCustomWidget) JFCustomWidget.sendData({ value: resultText() });
  }

  function showMenu(id, hideTimeId) {
    hideAllMenus();
    if (hideTimeId) el(hideTimeId).style.display = "none";
    el(id).classList.add("show");
    resize();
  }

  /* ---------- Reminder choice (after IN) ---------- */
  var pickCancelable = false;   // true when opened later from the IN menu

  function showReminderChoices(cancelable) {
    pickCancelable = !!cancelable;
    var m = el("pickMenu");
    m.innerHTML = '<span class="prompt">' +
      (cancelable && reminder ? "Change check-out reminder?" : "Check-out reminder?") + '</span>';
    cfg.reminders.concat(["None"]).forEach(function (opt) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = opt === "None" ? "none" : "choice";
      b.textContent = opt;
      b.onclick = function () {
        reminder = opt === "None" ? "" : opt;
        hideAllMenus();
        save();
      };
      m.appendChild(b);
    });
    if (cancelable) {
      var c = document.createElement("button");
      c.type = "button";
      c.className = "cancel";
      c.textContent = "Cancel";
      c.onclick = function () { hideAllMenus(); render(); };
      m.appendChild(c);
    }
    showMenu("pickMenu");
  }

  // Add or change a reminder after checking in (IN menu > Reminder)
  el("addRemBtn").onclick = function () { showReminderChoices(true); };

  /* ---------- Reminder confirm (at OUT) ---------- */
  function showReminderConfirm() {
    var m = el("remindMenu");
    m.innerHTML = "";
    var b = document.createElement("button");
    b.type = "button";
    b.className = "remind";
    b.textContent = "⚠ " + reminder + " — tap when done";
    b.onclick = function () {
      times.out = now();
      hideAllMenus();
      save();
    };
    m.appendChild(b);
    el("outNote").textContent = "";
    showMenu("remindMenu", "outInfo");
  }

  /* ---------- Button taps ---------- */
  el("inBtn").onclick = function () {
    if (el("pickMenu").classList.contains("show")) {
      if (pickCancelable) { hideAllMenus(); render(); }               // late add: tap IN to cancel
      return;                                                         // at check-in: must pick first
    }
    if (!times.in) {
      times.in = now();
      save();
      if (cfg.reminders.length) showReminderChoices();
    } else if (el("inMenu").classList.contains("show") || el("inEdit").classList.contains("show")) {
      hideAllMenus(); render();
    } else {
      showMenu("inMenu", "inTime");
    }
  };

  el("outBtn").onclick = function () {
    if (el("pickMenu").classList.contains("show")) return;
    if (!times.out) {
      if (el("remindMenu").classList.contains("show")) { hideAllMenus(); render(); return; } // cancel
      if (reminder) { showReminderConfirm(); }
      else { times.out = now(); save(); }
    } else if (el("outMenu").classList.contains("show") || el("outEdit").classList.contains("show")) {
      hideAllMenus(); render();
    } else {
      showMenu("outMenu", "outInfo");
    }
  };

  document.querySelectorAll(".update").forEach(function (b) {
    b.onclick = function () {
      times[b.getAttribute("data-key")] = now();
      hideAllMenus();
      save();
    };
  });
  /* ---------- Manual edit ---------- */
  // Turn a shown time like "1:09 pm Nov 10, 2026" back into a date for the picker
  function parseShown(text) {
    var months = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
    var t = (text || "").match(/(\d{1,2}):(\d{2})(?::\d{2})?\s*([ap])\.?m/i);
    var d = (text || "").match(/([A-Za-z]{3})[a-z]*\.?\s+(\d{1,2}),?\s+(\d{4})/);
    if (!d) {
      var n = (text || "").match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
      if (n) d = [null, months[+n[1] - 1], n[2], n[3].length === 2 ? "20" + n[3] : n[3]];
    }
    if (!d) return new Date();
    var mi = months.indexOf(String(d[1]).toLowerCase().slice(0, 3));
    if (mi < 0) return new Date();
    var h = 0, m = 0;
    if (t) {
      h = (+t[1]) % 12 + (t[3].toLowerCase() === "p" ? 12 : 0);
      m = +t[2];
    }
    return new Date(+d[3], mi, +d[2], h, m);
  }

  function toPickerValue(d) {
    function p(n) { return ("0" + n).slice(-2); }
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) +
           "T" + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  document.querySelectorAll(".edit").forEach(function (b) {
    b.onclick = function () {
      var key = b.getAttribute("data-key");
      el(key + "Input").value = toPickerValue(parseShown(times[key]));
      showMenu(key + "Edit", key === "in" ? "inTime" : "outInfo");
    };
  });
  document.querySelectorAll(".save").forEach(function (b) {
    b.onclick = function () {
      var key = b.getAttribute("data-key");
      var v = el(key + "Input").value;           // "2026-11-10T13:09"
      if (v) times[key] = formatDate(new Date(v), cfg.format);
      hideAllMenus();
      save();
    };
  });
  document.querySelectorAll(".cancel").forEach(function (b) {
    b.onclick = function () { hideAllMenus(); render(); };
  });

  document.querySelectorAll(".clear").forEach(function (b) {
    b.onclick = function () {
      var key = b.getAttribute("data-key");
      times[key] = "";
      if (key === "in") reminder = "";   // clearing IN also clears its reminder
      hideAllMenus();
      save();
    };
  });

  /* ---------- Restore saved values when a submission is reopened ---------- */
  function esc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

  function grab(saved, labels) {
    for (var i = 0; i < labels.length; i++) {
      var re = new RegExp("(?:^|\\n|\\|\\s*)" + esc(labels[i]) + ":\\s*([^|\\n\\r]*)");
      var m = saved.match(re);
      if (m) { var v = m[1].trim(); return v === "—" ? "" : v; }
    }
    return "";
  }

  function restore(saved) {
    if (!saved || typeof saved !== "string") return;
    saved = saved.replace(/<br\s*\/?>/gi, "\n");   // treat HTML line breaks as new lines
    times.in  = grab(saved, [cfg.inLabel, "In"]);
    times.out = grab(saved, [cfg.outLabel, "Out"]);
    var done  = saved.match(/(?:^|\n|\|\s*)✓\s*([^|\n\r]*)/);
    reminder  = done ? done[1].trim() : grab(saved, ["Reminder"]);
    save();
  }

  JFCustomWidget.subscribe("ready", function (data) {
    loadSettings();
    restore(data && data.value);
    render();

    JFCustomWidget.subscribe("submit", function () {
      JFCustomWidget.sendSubmit({
        valid: !!(times.in || times.out),
        value: resultText()
      });
    });
  });
</script>
</body>
</html>
