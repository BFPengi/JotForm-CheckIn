<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>In / Out Time Stamp</title>
<script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 4px; background: transparent; }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; height: 52px; }
  button { border: none; border-radius: 6px; color: #fff; cursor: pointer; font-weight: bold; }
  button:hover { opacity: 0.9; }
  .sq { width: 52px; height: 52px; font-size: 14px; flex-shrink: 0; }
  #inBtn  { background: #2e7d32; }
  #outBtn { background: #c62828; }
  .time { font-size: 14px; color: #333; }
  .menu { display: none; gap: 6px; }
  .menu.show { display: flex; }
  .menu button { padding: 8px 12px; font-size: 13px; }
  .update { background: #1565c0; }
  .clear  { background: #757575; }
</style>
</head>
<body>

<div class="row">
  <button id="inBtn" class="sq" type="button">IN</button>
  <span id="inTime" class="time"></span>
  <span id="inMenu" class="menu">
    <button type="button" class="update" data-key="in">Update</button>
    <button type="button" class="clear" data-key="in">Clear</button>
  </span>
</div>

<div class="row">
  <button id="outBtn" class="sq" type="button">OUT</button>
  <span id="outTime" class="time"></span>
  <span id="outMenu" class="menu">
    <button type="button" class="update" data-key="out">Update</button>
    <button type="button" class="clear" data-key="out">Clear</button>
  </span>
</div>

<script>
  var times = { in: "", out: "" };

  // Format: h:mm am/pm mmm d, yyyy  (e.g. 1:05 pm Nov 11, 2026)
  function now() {
    var d = new Date();
    var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    var h = d.getHours();
    var ampm = h >= 12 ? "pm" : "am";
    h = h % 12 || 12;
    var mm = ("0" + d.getMinutes()).slice(-2);
    return h + ":" + mm + " " + ampm + " " +
           months[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear();
  }

  // The text that gets saved in the submission
  function resultText() {
    return "In: " + (times.in || "—") + " | Out: " + (times.out || "—");
  }

  function el(id) { return document.getElementById(id); }

  function render(key) {
    var t = el(key + "Time");
    t.textContent = times[key];
  }

  function closeMenu(key) {
    el(key + "Menu").classList.remove("show");
    el(key + "Time").style.display = "";
  }

  function openMenu(key) {
    el(key + "Time").style.display = "none";
    el(key + "Menu").classList.add("show");
  }

  function save() {
    render("in");
    render("out");
    if (window.JFCustomWidget) {
      JFCustomWidget.sendData({ value: resultText() });
    }
  }

  // First tap records the time. Once a time is recorded it is locked:
  // tapping again only opens Update / Clear (tap the button again to cancel).
  function tap(key) {
    if (!times[key]) {
      times[key] = now();
      save();
    } else if (el(key + "Menu").classList.contains("show")) {
      closeMenu(key);
    } else {
      openMenu(key);
    }
  }

  el("inBtn").onclick  = function () { tap("in"); };
  el("outBtn").onclick = function () { tap("out"); };

  document.querySelectorAll(".update").forEach(function (b) {
    b.onclick = function () {
      var key = b.getAttribute("data-key");
      times[key] = now();
      closeMenu(key);
      save();
    };
  });
  document.querySelectorAll(".clear").forEach(function (b) {
    b.onclick = function () {
      var key = b.getAttribute("data-key");
      times[key] = "";
      closeMenu(key);
      save();
    };
  });

  // When a submission is reopened (e.g. from Tables), Jotform passes the
  // saved value back. Restore the locked times from it.
  function restore(saved) {
    if (!saved || typeof saved !== "string") return;
    var m = saved.match(/In:\s*(.*?)\s*\|\s*Out:\s*(.*)$/);
    if (!m) return;
    times.in  = (m[1] && m[1].trim() !== "—") ? m[1].trim() : "";
    times.out = (m[2] && m[2].trim() !== "—") ? m[2].trim() : "";
    save();
  }

  JFCustomWidget.subscribe("ready", function (data) {
    restore(data && data.value);
    JFCustomWidget.requestFrameResize({ height: 130 });

    JFCustomWidget.subscribe("submit", function () {
      JFCustomWidget.sendSubmit({
        // valid only if at least one time is recorded, so "Required" works
        valid: !!(times.in || times.out),
        value: resultText()
      });
    });
  });
</script>
</body>
</html>
